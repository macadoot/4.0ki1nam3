<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet"><title>macadoot · Ôn thi HK1 2026–2027</title>
<style>
:root{
  color-scheme:light;
  --bg:#f3f2ef;
  --surface:#ffffff;
  --ink:#1c1917;
  --ink-2:#44403c;
  --muted:#78716c;
  --line:#e7e5e4;
  --primary:#292524;
  --accent:#0d9488;
  --accent-soft:#ccfbf1;
  --accent-2:#0f766e;
  --warn:#f43f5e;
  --warn-soft:#ffe4e6;
  --amber-soft:#fef3c7;
  --amber:#b45309;
  --radius:20px;
  --radius-sm:14px;
  --shadow:0 1px 2px rgba(28,25,23,.04), 0 4px 12px rgba(28,25,23,.04);
  --shadow-lg:0 4px 6px rgba(28,25,23,.03), 0 12px 32px rgba(28,25,23,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:"Be Vietnam Pro",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.55;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.84);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{max-width:1040px;margin:0 auto;padding:16px 20px 0}
.brand{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  margin-bottom:14px;
}
.brand h1{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
.brand .sub{margin:3px 0 0;font-size:.8rem;color:var(--muted);font-weight:500}
.pill-date{
  flex-shrink:0;font-size:.7rem;font-weight:600;
  padding:6px 11px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent-2);white-space:nowrap;
}
nav{
  display:flex;gap:2px;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none;
  margin:0 -4px;padding:0 4px 12px;
}
nav::-webkit-scrollbar{display:none}
nav button{
  appearance:none;border:0;background:transparent;
  font-family:inherit;font-size:.8125rem;font-weight:500;
  color:var(--muted);cursor:pointer;
  padding:8px 14px;border-radius:999px;
  white-space:nowrap;transition:all .15s ease;
}
nav button:hover{color:var(--ink);background:rgba(28,25,23,.05)}
nav button.on{
  background:var(--primary);color:#fff;font-weight:600;
  box-shadow:0 2px 8px rgba(28,25,23,.18);
}
main{max-width:1040px;margin:0 auto;padding:20px 16px 48px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:18px 18px 16px;
  box-shadow:var(--shadow);transition:box-shadow .2s;
}
.card:hover{box-shadow:var(--shadow-lg)}
.card h3{margin:0 0 4px;font-size:.9375rem;font-weight:650;letter-spacing:-.02em;color:var(--ink)}
.meta{font-size:.8rem;color:var(--muted);margin-bottom:10px;line-height:1.5}
.stat{font-size:1.85rem;font-weight:700;letter-spacing:-.04em;color:var(--ink);line-height:1.15}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.84rem;color:var(--ink-2)}
.badge{
  display:inline-flex;align-items:center;
  font-size:.7rem;font-weight:600;
  padding:3px 9px;border-radius:999px;margin:2px 3px 2px 0;
}
.b-blue{background:var(--accent-soft);color:var(--accent-2)}
.b-pink{background:var(--warn-soft);color:#be123c}
.b-cream{background:var(--amber-soft);color:var(--amber)}
.b-grey{background:#f5f5f4;color:var(--muted)}
.bar{height:7px;background:#e7e5e4;border-radius:999px;overflow:hidden;margin:8px 0 6px}
.bar>span{
  display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,#14b8a6,#0d9488);
  transition:width .4s cubic-bezier(.22,1,.36,1);
}
.days{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:12px;margin-top:14px;
}
.day{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:13px;min-height:108px;transition:all .15s;
}
.day.today{border-color:#5eead4;box-shadow:0 0 0 1px #5eead4, var(--shadow)}
.day.sel{background:#f0fdfa;border-color:var(--accent)}
.day h4{margin:0 0 7px;font-size:.84rem;font-weight:650;color:var(--ink);cursor:pointer}
.day h4:hover{color:var(--accent-2)}
.entry{
  background:#fafaf9;border-radius:10px;padding:8px 10px;margin-top:6px;
  font-size:.78rem;position:relative;border:1px solid var(--line);
}
.entry b{color:var(--ink);font-weight:650}
.entry .x{
  position:absolute;right:5px;top:3px;border:0;background:transparent;
  color:var(--muted);cursor:pointer;font-size:15px;line-height:1;
  padding:3px 5px;border-radius:6px;opacity:.65;
}
.entry .x:hover{opacity:1;background:var(--warn-soft);color:var(--warn)}
form.log{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));
  gap:12px;align-items:end;
}
label{
  font-size:.72rem;font-weight:600;color:var(--muted);
  display:flex;flex-direction:column;gap:5px;
  text-transform:uppercase;letter-spacing:.04em;
}
input,select,textarea{
  font:inherit;font-size:.875rem;font-weight:500;
  padding:10px 12px;border:1.5px solid var(--line);
  border-radius:11px;background:#fff;color:var(--ink);
  transition:border-color .15s,box-shadow .15s;outline:none;
  text-transform:none;letter-spacing:0;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3.5px rgba(13,148,136,.15);
}
textarea{
  width:100%;min-height:148px;
  font-family:ui-monospace,"SF Mono",Consolas,monospace;
  font-size:.8rem;line-height:1.55;resize:vertical;
}
.btn{
  appearance:none;border:0;font-family:inherit;
  background:var(--primary);color:#fff;
  border-radius:12px;padding:11px 18px;
  font-size:.875rem;font-weight:600;cursor:pointer;
  transition:transform .12s,background .15s,box-shadow .15s;
  box-shadow:0 1px 2px rgba(0,0,0,.12);
}
.btn:hover{background:#0c0a09}
.btn:active{transform:scale(.97)}
.btn.alt{background:var(--warn-soft);color:#be123c;box-shadow:none}
.btn.alt:hover{background:#fecdd3}
.btn.ghost{background:var(--accent-soft);color:var(--accent-2);box-shadow:none}
.btn.ghost:hover{background:#99f6e4}
.btn.danger{background:var(--warn-soft);color:#be123c;box-shadow:none}
.btn.danger:hover{background:#fecdd3}
.chk{
  display:flex;align-items:center;gap:10px;
  font-size:.875rem;padding:10px 0;border-bottom:1px solid var(--line);
}
.chk:last-of-type{border-bottom:0}
.chk input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;cursor:pointer}
.chk.done span{text-decoration:line-through;color:var(--muted);opacity:.7}
h2{font-size:1rem;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin:26px 0 12px}
.section{margin-top:16px}
.hint{font-size:.8rem;color:var(--muted);margin:8px 0;line-height:1.5}
.opt{
  display:block;width:100%;text-align:left;
  margin:8px 0;padding:13px 15px;
  border:1.5px solid var(--line);border-radius:13px;
  background:#fff;font:inherit;font-size:.875rem;font-weight:500;
  cursor:pointer;color:var(--ink);font-family:inherit;transition:all .15s;
}
.opt:hover{border-color:var(--accent);background:#f0fdfa;box-shadow:0 2px 10px rgba(13,148,136,.08)}
.opt.good{background:#d1fae5;border-color:#6ee7b7;color:#065f46}
.opt.bad{background:#ffe4e6;border-color:#fda4af;color:#9f1239}
pre{
  background:#1c1917;color:#e7e5e4;border:0;border-radius:14px;
  padding:14px 16px;font-size:.8rem;overflow-x:auto;white-space:pre;line-height:1.6;
}
ul{margin:6px 0 0;padding-left:1.2rem;font-size:.875rem;line-height:1.7;color:var(--ink-2)}
@media (max-width:540px){
  .topbar-inner{padding:14px 14px 0}
  .brand h1{font-size:1.1rem}
  main{padding:16px 12px 40px}
  .card{padding:15px;border-radius:16px}
  form.log{grid-template-columns:1fr}
  nav button{padding:7px 12px;font-size:.78rem}
}
.hk{background:#fde68a;color:#78350f;border-radius:5px;padding:0 4px;font-family:ui-monospace,Consolas,monospace;font-size:.92em;font-weight:600}
details.wk{padding:0;overflow:hidden}
details.wk>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);color:var(--accent-2)}
details.wk>summary::-webkit-details-marker{display:none}
details.wk>summary h3{margin:0;font-size:15px;color:var(--accent-2)}
details.wk>summary::after{content:'▾';font-size:18px;transition:transform .2s}
details.wk[open]>summary::after{transform:rotate(180deg)}
details.wk>.wkbody{padding:4px 18px 16px}

.dash{display:grid;gap:14px;margin-bottom:18px}
.dash-row{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media (max-width:760px){.dash-row{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.kpi .v{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.kpi .l{font-size:.75rem;color:var(--muted);font-weight:500}
.kpi .d{font-size:.72rem;font-weight:600;color:var(--accent-2);margin-top:4px}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.chart-card h3{margin:0 0 4px;font-size:.95rem}
.chart-card .sub{font-size:.75rem;color:var(--muted);margin-bottom:8px}
.chart-card svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:10px;font-size:.72rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.timeline .t-row{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:.8rem;margin:7px 0}
.timeline .t-track{position:relative;height:10px;background:var(--bg);border-radius:99px}
.timeline .t-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#0d9488,#5eead4)}
.timeline .t-mark{position:absolute;top:-4px;width:2px;height:18px;background:var(--warn);border-radius:2px}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div>
        <h1>macadoot · Ôn thi HK1 2026–2027</h1>
        <p class="sub">Lịch 18/11 – 21/12 · 7 môn · 62 chương</p>
      </div>
      <span class="pill-date">18/11 → 21/12</span>
    </div>
    <nav>
      <button data-tab="overview" class="on" onclick="setTab('overview')">Tổng quan</button>
      <button data-tab="days" onclick="setTab('days')">Lịch</button>
      <button data-tab="subjects" onclick="setTab('subjects')">Môn học</button>
      <button data-tab="quiz" onclick="setTab('quiz')">Luyện đề</button>
      <button data-tab="webcode" onclick="setTab('webcode')">Thiết kế WEB</button>
      <button data-tab="backup" onclick="setTab('backup')">Sao lưu</button>
    </nav>
  </div>
</header>
<main id="view"></main>

<script>
const KEY = 'ontap-hk1-v1';
const WD = ['CN','T2','T3','T4','T5','T6','T7'];
const TYPES = [['study','Học chương'],['quiz','Trắc nghiệm'],['essay','Tự luận'],['code','Code Web'],['mock','Thi thử']];
const chs = n => Array.from({length:n}, (_,i) => 'Chương ' + (i+1));

const WEB_CH = ['Chương 1: Tổng quan về thiết kế Web và lập trình Web','Chương 2: Ngôn ngữ đánh dấu văn bản HTML','Chương 3: Định dạng phong cách Web với CSS','Chương 4: Thiết kế bố cục Web và Web đáp ứng','Chương 5: Ngôn ngữ Javascript'];
const SUBJECTS = [
  {id:'web', name:'Thiết kế WEB', exam:'2026-11-26', time:'07:00', form:'Viết code trên web trường', ch:WEB_CH},
  {id:'en',  name:'Tiếng Anh ngành Marketing', exam:'2026-11-29', time:'13:00', form:'Trắc nghiệm', ch:chs(12)},
  {id:'dv',  name:'Marketing dịch vụ', exam:'2026-12-02', time:'07:00', form:'Thi viết', ch:chs(11)},
  {id:'ds',  name:'Khoa học dữ liệu', exam:'2026-12-05', time:'07:00', form:'Trắc nghiệm', ch:chs(12)},
  {id:'bh',  name:'Kỹ năng bán hàng & QT bán hàng', exam:'2026-12-07', time:'07:00', form:'Thi viết',
     ch:['Sale planning & road map','4 bước cuối sales planning road map','Quản trị lực lượng bán hàng','Logic xuyên suốt bài làm']},
  {id:'mxh', name:'Marketing trên mạng xã hội', exam:'2026-12-08', time:'07:00', form:'Thi viết', ch:chs(9)},
  {id:'nc', name:'Nghiên cứu Marketing', exam:'2026-12-20', time:'13:00', form:'Trắc nghiệm', ch:chs(10)}
];
const SUBJ = Object.fromEntries(SUBJECTS.map(s => [s.id, s]));

function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function vdate(k){const [y,m,d]=k.split('-');return d+'/'+m+'/'+y}
const DAYS = [];
for(let d=new Date(2026,10,18); d<=new Date(2026,11,21); d.setDate(d.getDate()+1)) DAYS.push(ymd(d));
function dayLabel(k){const d=new Date(k+'T00:00');return WD[d.getDay()]+' '+vdate(k)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

let state = load() || {logs:[], done:{}};
let ui = {tab:'overview', day: DAYS.includes(ymd(new Date())) ? ymd(new Date()) : DAYS[0]};

function load(){try{const o=JSON.parse(localStorage.getItem(KEY));return o&&Array.isArray(o.logs)?o:null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

function doneCount(s){return (state.done[s.id]||[]).length}
function totals(){let d=0,t=0;SUBJECTS.forEach(s=>{d+=doneCount(s);t+=s.ch.length});return{d,t}}
function avg(s){const sc=state.logs.filter(l=>l.subject===s.id&&l.score!=null).map(l=>+l.score);
  return sc.length?(sc.reduce((a,b)=>a+b,0)/sc.length).toFixed(1):'—'}
function daysLeft(s){const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(s.exam+'T00:00')-t)/864e5)}
function bar(p){return '<div class="bar"><span style="width:'+p+'%"></span></div>'}

function setTab(t){ui.tab=t;render()}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
  const V={overview:vOverview,days:vDays,subjects:vSubjects,quiz:vQuiz,backup:vBackup,webcode:vWeb};
  document.getElementById('view').innerHTML = V[ui.tab]();
  window.scrollTo(0,0);
}


function dashKpis(){
  const {d,t}=totals(), pct=Math.round(d/t*100);
  const mins=state.logs.reduce((a,l)=>a+(+l.minutes||0),0);
  const sc=state.logs.filter(l=>l.score!=null).map(l=>+l.score);
  const avgAll=sc.length?(sc.reduce((a,b)=>a+b,0)/sc.length).toFixed(1):'—';
  const next=SUBJECTS.map(s=>({s,dl:daysLeft(s)})).filter(x=>x.dl>=0).sort((a,b)=>a.dl-b.dl)[0];
  return `<div class="kpis">
    <div class="kpi"><div class="l">Tiến độ tổng</div><div class="v">${pct}%</div><div class="d">${d}/${t} chương</div></div>
    <div class="kpi"><div class="l">Thời gian đã học</div><div class="v">${(mins/60).toFixed(1)} giờ</div><div class="d">${state.logs.length} buổi đã ghi</div></div>
    <div class="kpi"><div class="l">Điểm trung bình</div><div class="v">${avgAll}</div><div class="d">${sc.length} bài có điểm</div></div>
    <div class="kpi"><div class="l">Thi gần nhất</div><div class="v">${next?next.dl+' ngày':'—'}</div><div class="d">${next?esc(next.s.name):'Đã hết lịch'}</div></div>
  </div>`;
}
function dashCumChart(){
  const today=ymd(new Date());
  const days=DAYS.filter(k=>k<=today);
  const use=days.length>1?days:DAYS.slice(0,2);
  let cum=0; const pts=use.map(k=>{cum+=state.logs.filter(l=>l.date===k).reduce((a,l)=>a+(+l.minutes||0),0);return cum});
  const W=600,H=180,P=10,max=Math.max(60,...pts);
  const xy=pts.map((v,i)=>[P+i*(W-2*P)/Math.max(1,pts.length-1), H-P-(v/max)*(H-2*P)]);
  const line=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${xy[xy.length-1][0].toFixed(1)} ${H-P} L${P} ${H-P} Z`;
  const grid=[0,.25,.5,.75,1].map(f=>`<line x1="${P}" x2="${W-P}" y1="${(P+f*(H-2*P)).toFixed(1)}" y2="${(P+f*(H-2*P)).toFixed(1)}" stroke="#e7e5e4" stroke-dasharray="3 4"/>`).join('');
  const last=xy[xy.length-1]||[P,H-P];
  return `<div class="chart-card"><h3>Tăng trưởng thời gian học</h3><div class="sub">Tổng phút đã học cộng dồn theo ngày · ${(pts[pts.length-1]||0)} phút</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="gA" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0d9488" stop-opacity=".35"/><stop offset="1" stop-color="#0d9488" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#gA)"/><path d="${line}" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" fill="#0f766e"/></svg></div>`;
}
function dashDonut(){
  const {d,t}=totals(), pct=t?d/t:0, C=2*Math.PI*44;
  return `<div class="chart-card"><h3>Tỷ lệ hoàn thành</h3><div class="sub">Chương đã đánh dấu trên tổng số chương</div>
    <div style="display:flex;align-items:center;gap:16px"><svg viewBox="0 0 120 120" style="width:130px;flex-shrink:0">
      <circle cx="60" cy="60" r="44" fill="none" stroke="#e7e5e4" stroke-width="12"/>
      <circle cx="60" cy="60" r="44" fill="none" stroke="#0d9488" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/>
      <text x="60" y="66" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">${Math.round(pct*100)}%</text></svg>
      <div class="legend" style="flex-direction:column;align-items:flex-start"><span><i style="background:#0d9488"></i>Đã xong: ${d}</span><span><i style="background:#e7e5e4"></i>Còn lại: ${t-d}</span></div></div></div>`;
}
function dashSubjectBars(){
  const cols=['#0d9488','#f59e0b','#ec4899','#6366f1','#10b981','#f43f5e','#0ea5e9'];
  return `<div class="chart-card"><h3>Tiến độ theo môn</h3><div class="sub">Số chương đã học / tổng chương</div>` +
    SUBJECTS.map((s,i)=>{const p=Math.round(doneCount(s)/s.ch.length*100);
      return `<div style="margin:9px 0"><div class="row" style="font-size:.78rem"><span>${esc(s.name)}</span><b>${p}%</b></div><div class="bar"><span style="width:${p}%;background:${cols[i%cols.length]}"></span></div></div>`}).join('') + `</div>`;
}
function dashTimeline(){
  const today=new Date(); today.setHours(0,0,0,0);
  const first=new Date(2026,10,18), span=(new Date(2026,11,21)-first)/864e5;
  const pos=k=>{const d=new Date(k+'T00:00');return Math.min(100,Math.max(0,(d-first)/864e5/span*100))};
  const tPos=Math.min(100,Math.max(0,(today-first)/864e5/span*100));
  const rows=[...SUBJECTS].sort((a,b)=>a.exam.localeCompare(b.exam)).map(s=>{const p=Math.round(doneCount(s)/s.ch.length*100);
    return `<div class="t-row"><span>${esc(s.name)}</span><div class="t-track"><div class="t-fill" style="width:${p}%"></div><div class="t-mark" style="left:${pos(s.exam).toFixed(1)}%" title="${vdate(s.exam)}"></div></div><span style="text-align:right;color:var(--muted)">${vdate(s.exam).slice(0,5)}</span></div>`}).join('');
  return `<div class="chart-card timeline"><h3>Lịch thi & tiến độ</h3><div class="sub">Vạch đỏ là ngày thi, thanh xanh là mức hoàn thành</div>${rows}</div>`;
}
function dashHTML(){
  return `<div class="dash">${dashKpis()}<div class="dash-row">${dashCumChart()}${dashDonut()}</div><div class="dash-row">${dashSubjectBars()}${dashTimeline()}</div></div>`;
}

function vOverview(){
  const {d,t}=totals(), pct=Math.round(d/t*100);
  const mins=state.logs.reduce((a,l)=>a+(+l.minutes||0),0);
  const todayLogs=state.logs.filter(l=>l.date===ymd(new Date())).length;
  let h=dashHTML()+`<div class="grid">
    <div class="card"><div class="meta">Tăng trưởng tổng</div><div class="stat">${d}/${t} chương</div>${bar(pct)}<div class="meta">${pct}% · còn ${t-d} chương</div></div>
    <div class="card"><div class="meta">Tổng thời gian đã ghi</div><div class="stat">${(mins/60).toFixed(1)} giờ</div><div class="meta">${state.logs.length} buổi đã ghi</div></div>
    <div class="card"><div class="meta">Hôm nay</div><div class="stat">${todayLogs} buổi</div><div class="meta">${ymd(new Date())===ymd(new Date())?'Ghi thêm ở tab Lịch':''}</div></div>
  </div><h2>Tiến độ từng môn</h2><div class="grid">`;
  [...SUBJECTS].sort((a,b)=>a.exam.localeCompare(b.exam)).forEach(s=>{
    const dl=daysLeft(s), p=Math.round(doneCount(s)/s.ch.length*100);
    h+=`<div class="card"><h3>${esc(s.name)}</h3>
      <div class="meta"><span class="badge b-pink">${dl>=0?'Còn '+dl+' ngày':'Đã thi'}</span><span class="badge b-blue">${vdate(s.exam)} · ${s.time}</span><br>${esc(s.form)}</div>
      ${bar(p)}<div class="row"><span>${doneCount(s)}/${s.ch.length} chương</span><span>Điểm TB: <b>${avg(s)}</b></span></div></div>`;
  });
  return h+'</div>';
}

function chOpts(sid,sel=''){
  return '<option value="">Không rõ</option>'+(SUBJ[sid]?SUBJ[sid].ch.map((c,i)=>`<option value="${i}" ${String(i)===String(sel)?'selected':''}>${esc(c)}</option>`).join(''):'');
}
function vDays(){
  const exams = SUBJECTS.filter(s=>s.exam);
  let h=`<div class="card"><h3>Ghi buổi học / làm bài</h3>
  <form class="log" onsubmit="return addLog(event)">
    <label>Ngày<select name="date">${DAYS.map(k=>`<option value="${k}" ${k===ui.day?'selected':''}>${dayLabel(k)}</option>`).join('')}</select></label>
    <label>Môn<select name="subject" onchange="document.getElementById('chSel').innerHTML=chOpts(this.value)">${SUBJECTS.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label>
    <label>Hoạt động<select name="type">${TYPES.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label>
    <label>Chương<select name="chapter" id="chSel">${chOpts(SUBJECTS[0].id)}</select></label>
    <label>Điểm (0–10)<input name="score" type="number" min="0" max="10" step="0.25" placeholder="để trống nếu không chấm"></label>
    <label>Số phút<input name="minutes" type="number" min="0" step="5" placeholder="VD: 50"></label>
    <label style="grid-column:span 2">Ghi chú<input name="note" placeholder="VD: sai câu SQL join, làm đề thử 2"></label>
    <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" name="mark" checked> Đánh dấu chương đã học</label>
    <button class="btn" type="submit">Lưu</button>
  </form></div>
  <div class="hint">Hôm nay được tô hồng. Bấm tên ngày để chọn ngày ghi.</div>
  <div class="days">`;
  DAYS.forEach(k=>{
    const ents=state.logs.filter(l=>l.date===k);
    const ex=exams.filter(s=>s.exam===k);
    const cls=[k===ymd(new Date())?'today':'', k===ui.day?'sel':''].join(' ');
    h+=`<div class="day ${cls}"><h4 onclick="pickDay('${k}')">${dayLabel(k)}</h4>
      ${ex.map(s=>`<span class="badge b-pink">THI ${esc(s.name)} ${s.time}</span>`).join('')}
      ${ents.map(l=>{const s=SUBJ[l.subject];const tp=TYPES.find(t=>t[0]===l.type)[1];
        const cn=l.chapter!==''&&s?' · '+esc(s.ch[+l.chapter]):'';
        return `<div class="entry"><button class="x" onclick="delLog('${l.id}')">×</button><b>${esc(s?s.name:'')}</b><br>${tp}${cn}
        ${l.score!=null?' · <b>'+l.score+'đ</b>':''}${l.minutes?' · '+l.minutes+' phút':''}${l.note?'<br><i>'+esc(l.note)+'</i>':''}</div>`}).join('')}
    </div>`;
  });
  return h+'</div>';
}
function pickDay(k){ui.day=k;render()}

function vSubjects(){
  let h='';
  SUBJECTS.forEach(s=>{
    const done=state.done[s.id]||[];
    h+=`<div class="card section"><h3>${esc(s.name)}</h3>
    <div class="meta">${vdate(s.exam)} · ${s.time} · ${esc(s.form)} · Điểm TB: <b>${avg(s)}</b></div>
    ${bar(Math.round(done.length/s.ch.length*100))}
    ${s.ch.map((c,i)=>`<label class="chk ${done.includes(i)?'done':''}" style="flex-direction:row;font-size:14px;color:var(--ink)">
      <input type="checkbox" ${done.includes(i)?'checked':''} onchange="toggleCh('${s.id}',${i})"><span>${esc(c)}</span></label>`).join('')}
    <h2 style="font-size:14px">Lịch sử điểm</h2>
    ${state.logs.filter(l=>l.subject===s.id&&l.score!=null).sort((a,b)=>a.date.localeCompare(b.date)).map(l=>
      `<div class="meta">${dayLabel(l.date)} · ${TYPES.find(t=>t[0]===l.type)[1]} · <b>${l.score}đ</b>${l.note?' · '+esc(l.note):''}</div>`).join('')
      || '<div class="meta">Chưa có điểm.</div>'}
    </div>`;
  });
  return h;
}
function toggleCh(sid,i){
  const arr=state.done[sid]||[];
  const at=arr.indexOf(i); at>=0?arr.splice(at,1):arr.push(i);
  state.done[sid]=arr; save(); render();
}

function vBackup(){
  return `<div class="card"><h3>Sao lưu & khôi phục</h3>
  <div class="hint">Dữ liệu chỉ nằm trên trình duyệt này. Hãy xuất file định kỳ, nhất là trước khi đổi máy hoặc xóa dữ liệu trình duyệt.</div>
  <textarea id="json">${esc(JSON.stringify(state,null,2))}</textarea>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
    <button class="btn" onclick="exportJSON()">Tải file .json</button>
    <button class="btn ghost" onclick="copyJSON()">Sao chép</button>
    <button class="btn alt" onclick="importJSON()">Nhập từ ô trên</button>
    <button class="btn danger" onclick="resetAll()">Xóa toàn bộ</button>
  </div></div>`;
}
function exportJSON(){
  const txt=JSON.stringify(state,null,2);
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    a.download='ontap-hk1-'+ymd(new Date())+'.json';a.click();}catch(e){alert('Trình xem này không cho tải file. Hãy dùng nút Sao chép.')}
}
function copyJSON(){
  const t=document.getElementById('json').value;
  navigator.clipboard?.writeText(t).then(()=>alert('Đã sao chép')).catch(()=>alert('Không sao chép được, hãy chọn và copy thủ công.'));
}
function importJSON(){
  try{
    const o=JSON.parse(document.getElementById('json').value);
    if(!Array.isArray(o.logs)||typeof o.done!=='object'||o.done===null) throw new Error();
    state=o; save(); render(); alert('Đã nhập dữ liệu');
  }catch(e){alert('JSON không hợp lệ')}
}
function resetAll(){
  if(confirm('Xóa toàn bộ tiến trình? Không thể hoàn tác.')){state={logs:[],done:{}};save();render()}
}

function addLog(e){
  e.preventDefault();
  const f=e.target, sc=f.score.value;
  const log={id:uid(), date:f.date.value, subject:f.subject.value, type:f.type.value, chapter:f.chapter.value,
    score: sc===''?null:Math.min(10,Math.max(0,+sc)), minutes:+f.minutes.value||0, note:f.note.value.trim()};
  state.logs.push(log);
  if(log.type==='study' && log.chapter!=='' && f.mark.checked){
    const arr=state.done[log.subject]||[], idx=+log.chapter;
    if(!arr.includes(idx)) arr.push(idx);
    state.done[log.subject]=arr;
  }
  ui.day=log.date; save(); render(); return false;
}
function delLog(id){
  if(!confirm('Xóa ghi chép này?')) return;
  state.logs=state.logs.filter(l=>l.id!==id); save(); render();
}

}

Đây là thuật ngữ nào?", ["Marketing stimuli", "Word-of-mouth influence", "Belief", "Opinion leader"], 1], ["Người có địa vị xã hội cao và nhiều người theo dõi trong mạng xã hội của họ, thường được lắng nghe khi nói về sản phẩm. Đây là thuật ngữ nào?", ["Early adopter", "Opinion leader", "Influencer của doanh nghiệp", "Gatekeeper"], 1], ["Một ý nghĩ mang tính mô tả mà một người nắm giữ về điều gì đó. Đây là thuật ngữ nào?", ["Belief", "Attitude", "Perception", "Motive"], 0], ["Các yếu tố như tuổi, giai đoạn vòng đời có thể ảnh hưởng đến hành vi người mua. Đây là thuật ngữ nào?", ["Social factors", "Marketing stimuli", "Situational factors", "Adoption process"], 0], ["Các sự kiện bất ngờ, ví dụ kinh tế xấu đi hoặc bạn bè phản hồi thất vọng, làm thay đổi ý định mua. Đây là thuật ngữ nào?", ["Situational factors", "Social factors", "Adoption process", "Buying center"], 0], ["Quá trình tinh thần mà một cá nhân trải qua từ lần đầu nghe về một đổi mới đến khi chấp nhận hoàn toàn. Đây là thuật ngữ nào?", ["Adoption process", "Buyer decision process", "Buying center", "Trial"], 0], ["Người tiêu dùng thử sản phẩm mới nhưng chưa có cam kết mua tiếp. Đây là giai đoạn nào trong adoption process?", ["Trial", "Evaluation", "Adoption", "Awareness"], 0], ["Sản phẩm mà người tiêu dùng không cần suy nghĩ nhiều trước khi mua, có thể chỉ chọn thương hiệu quen thuộc theo thói quen. Đây là loại nào?", ["High-involvement product", "Low-involvement product", "Complex buying behavior", "Dissonance-reducing buying behavior"], 1], ["Hành vi mua xảy ra khi người tiêu dùng rất tham gia vào việc mua sản phẩm đắt, rủi ro hoặc ít khi mua. Đây là hành vi nào?", ["Habitual buying behavior", "Complex buying behavior", "Variety-seeking buying behavior", "Dissonance-reducing buying behavior"], 1], ["Sản phẩm đắt, ít khi mua, người mua thấy khác biệt giữa các thương hiệu rất nhỏ. Đây là hành vi nào?", ["Complex buying behavior", "Dissonance-reducing buying behavior", "Habitual buying behavior", "Variety-seeking buying behavior"], 1], ["Nhóm adopter chấp nhận ý tưởng mới sớm nhất và chịu một mức rủi ro nhất định. Đây là nhóm nào?", ["Innovators", "Early adopters", "Late mainstream", "Laggards"], 0], ["Nhóm adopter nghi ngờ thay đổi, chỉ chấp nhận đổi mới khi nó đã trở thành một thứ mang tính truyền thống. Đây là nhóm nào?", ["Innovators", "Late mainstream", "Lagging adopters", "Early adopters"], 2], ["Tất cả các cá nhân và đơn vị đóng vai trò trong quá trình ra quyết định mua của một tổ chức. Đây là thuật ngữ nào?", ["Buying center", "Buyers", "Users", "Deciders"], 0], ["Thành viên trung tâm mua kiểm soát luồng thông tin đến những người khác trong tổ chức. Đây là vai trò nào?", ["Gatekeepers", "Influencers", "Deciders", "Buyers"], 0], ["Giai đoạn trong quy trình mua tổ chức, người mua cố gắng tìm ra nhà cung cấp tốt nhất. Đây là giai đoạn nào?", ["Supplier research", "Supplier selection", "Proposal solicitation", "Performance review"], 0], ["Nghĩa tiếng Việt của \"opinion leader\" là gì?", ["Người dẫn dắt ý kiến", "Người kiểm soát thông tin", "Người quyết định mua", "Người sử dụng cuối"], 0], ["Nghĩa tiếng Việt của \"social class\" là gì?", ["Tầng lớp xã hội", "Nhóm tham chiếu", "Hành vi mua", "Niềm tin"], 0], ["Nghĩa tiếng Việt của \"buying center\" là gì?", ["Trung tâm mua", "Trung tâm phân phối", "Trung tâm dịch vụ", "Trung tâm quảng cáo"], 0], ["Nghĩa tiếng Việt của \"gatekeepers\" là gì?", ["Người gác cổng", "Người đánh giá", "Người sử dụng", "Người quyết định"], 0], ["Nghĩa tiếng Việt của \"habitual buying behavior\" là gì?", ["Hành vi mua theo thói quen", "Hành vi tìm kiếm đa dạng", "Hành vi mua phức tạp", "Hành vi giảm bất hòa"], 0], ["Nghĩa tiếng Việt của \"lagging adopters\" là gì?", ["Người chấp nhận chậm", "Người đổi mới", "Người tiên phong", "Người dẫn dắt"], 0], ["Hành vi mua sắm của người tiêu dùng cuối cùng để phục vụ tiêu dùng cá nhân được gọi là consumer buyer behavior.", ["True", "False"], 0], ["Trong mô hình kích thích - phản ứng, các yếu tố kinh  bắt buộc phải truyền", "Tham số bị xóa khỏi hàm", "Hàm không nhận tham số"], 0], ["Cho def f(a, b=2): return a + b. f(3) trả về gì?", ["3", "5", "2", "Lỗi"], 1], ["Cho a = np.array([1, 2, 3]), np.mean(a) bằng bao nhiêu?", ["6", "2.0", "3", "1.5"], 1], ["Hàm nào trả về phần tử lớn nhất của mảng NumPy a?", ["np.min(a)", "np.max(a)", "np.sort(a)", "np.len(a)"], 1], ["Cho a = np.array([1, 2, 3]), sau lệnh a[0] = 10 thì a là gì?", ["[10 2 3]", "Không đổi", "Lỗi", "[1 2 10]"], 0], ["Trong Python, kiểu dữ liệu nào KHÔNG thay đổi được (immutable)?", ["list", "dict", "tuple", "set"], 2], ["Đúng hay sai: Chỉ số (index) trong danh sách Python bắt đầu từ 0.", ["Đúng", "Sai"], 0], ["Đúng hay sai: range(5) bao gồm số 5.", ["Đúng", "Sai"], 1], ["Đúng hay sai: NumPy có thể thực hiện phép nhân ma trận bằng np.dot.", ["Đúng", "Sai"], 0], ["Đúng hay sai: Hàm print() mặc định kết thúc bằng xuống dòng.", ["Đúng", "Sai"], 0], ["Đúng hay sai: Chuỗi (str) trong Python có thể thay đổi trực tiếp từng ký tự.", ["Đúng", "Sai"], 1]];
let Q={on:false};
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function vQuiz(){
  if(Q.on) return quizCard();
  const subs=SUBJECTS.filter(s=>QB[s.id]);
  if(!subs.length) return `<div class='card'>Chưa có bộ câu hỏi.</div>`;
  const sel=document.getElementById('qs');
  const sid=sel&&QB[sel.value]?sel.value:subs[0].id;
  const chs=Object.keys(QB[sid]).map(Number);
  return `<div class='card'><h3>Luyện trắc nghiệm</h3><div class='hint'>Đáp án hiện ngay sau khi chọn. Thứ tự câu và đáp án được đảo mỗi lần làm. Kết thúc bài sẽ ghi điểm vào lịch hôm nay.</div>
  <div class='row' style='margin-top:12px;flex-wrap:wrap;gap:10px'>
  <label>Môn<select id='qs' onchange='render()'>${subs.map(s=>`<option value='${s.id}' ${s.id===sid?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
  <label>Chương<select id='qc'>${chs.map(i=>`<option value='${i}'>${esc(SUBJ[sid].ch[i])} (${QB[sid][i].length} câu)</option>`).join('')}</select></label>
  <button class='btn' onclick='startQuiz()'>Bắt đầu</button></div></div>`;
}
function startQuiz(){
  const sub=document.getElementById('qs').value, ch=+document.getElementById('qc').value;
  const list=QB[sub][ch].map(it=>{const idx=sh(it[1].map((_,i)=>i));return {q:it[0],opts:idx.map(i=>it[1][i]),ans:idx.indexOf(it[2])}});
  Q={on:true,sub,ch,list:sh(list),i:0,sel:null,ok:0,wrong:[],saved:false};
  render();
}
function quizCard(){
  const n=Q.list.length, s=SUBJ[Q.sub], sub=`${esc(s.name)} · ${esc(s.ch[Q.ch])}`;
  if(Q.i>=n){
    if(!Q.saved){state.logs.push({id:uid(),date:ymd(new Date()),subject:Q.sub,type:'quiz',chapter:String(Q.ch),score:Math.round(Q.ok/n*100)/10,minutes:0,note:'Trắc nghiệm: '+Q.ok+'/'+n+' đúng'});save();Q.saved=true;}
    return `<div class='card'><h3>Kết quả</h3><div class='stat'>${Q.ok}/${n} đúng (${Math.round(Q.ok/n*100)}%)</div><div class='meta'>${sub}</div>${Q.wrong.length?`<h2>Câu sai</h2>${Q.wrong.map(w=>`<div class='meta'>• ${esc(w)}</div>`).join('')}`:`<div class='meta'>Không có câu sai.</div>`}<div style='margin-top:14px'><button class='btn' onclick='exitQuiz()'>Xong</button></div></div>`;
  }
  const q=Q.list[Q.i], done=Q.sel!==null;
  return `<div class='card'><div class='meta'>Câu ${Q.i+1}/${n} · ${sub} · đúng ${Q.ok}</div>
  <h3 style='font-size:16px;line-height:1.5'>${esc(q.q)}</h3>
  ${q.opts.map((o,k)=>{let c='';if(done){if(k===q.ans)c='good';else if(k===Q.sel)c='bad';}return `<button class='opt ${c}' onclick='pick(${k})'>${esc(o)}</button>`}).join('')}
  ${done?`<div class='hint'>${Q.sel===q.ans?'Chính xác.':'Đáp án đúng: '+esc(q.opts[q.ans])}</div><button class='btn' onclick='nextQ()'>${Q.i+1>=n?'Xem kết quả':'Câu tiếp'}</button>`:''}</div>`;
}
function pick(k){const q=Q.list[Q.i];if(Q.sel!==null)return;Q.sel=k;if(k===q.ans)Q.ok++;else Q.wrong.push(q.q);render();}
function nextQ(){Q.i++;Q.sel=null;render();}
function exitQuiz(){Q={on:false};render();}
render();
</script>
